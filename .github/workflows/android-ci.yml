name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-34/android.jar" || ! -x "$sdk_root/build-tools/34.0.0/apksigner" ]]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(find -L "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
            fi
            test -x "$sdkmanager"
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-34' 'build-tools;34.0.0'
          fi
          test -f "$sdk_root/platforms/android-34/android.jar"
          test -x "$sdk_root/build-tools/34.0.0/apksigner"
      - name: Unit tests and debug APKs
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify ABI APKs and signatures
        shell: bash
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/debug/app-$abi-debug.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "native-code: '$abi'"
          done
          cd app/build/outputs/apk/debug
          sha256sum app-arm64-v8a-debug.apk app-armeabi-v7a-debug.apk > SHA256SUMS.txt
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-watch-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
