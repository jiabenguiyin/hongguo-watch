name: Offline watch UI preview

on:
  push:
    branches: [test/ui-preview-v0.4.28]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare UI-only emulator build
        run: |
          # Remove only ABI-dependent native libraries in this disposable checkout.
          # This build is NOT a distributable APK and cannot validate IJK playback.
          rm -rf ijkplayer-java/src/main/jniLibs
          sed -i 's/isEnable = true/isEnable = false/' app/build.gradle.kts
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          bash ./gradlew --no-daemon :app:assembleDebug
          find app/build/outputs/apk/debug -name '*.apk'
      - name: Launch Android emulator and capture offline screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/ui-preview.py
      - name: Upload actual emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-ui-v0.4.28
          path: ui-preview/
          if-no-files-found: warn
          retention-days: 7
